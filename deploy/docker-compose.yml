# =====================================================================
#  一建通 · 本地 / 单机生产 部署编排
#
#  Batch 2 默认启动：postgres + redis + api
#      cp .env.example .env       # 首次需先改密码
#      docker compose up -d --build
#      → http://localhost:8000/docs
#
#  需要检索与对象存储时（Batch 3+ 才用得上）：
#      docker compose --profile extras up -d
#
#  其他常用：
#      docker compose logs -f api
#      docker compose exec api python -m app.cli seed-questions
#      docker compose down            # 停止（保留数据）
#      docker compose down -v         # 停止并清空数据卷
# =====================================================================

name: yijian

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:

  # ------------------------------------------------------------------
  # PostgreSQL 16
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: yijian-postgres
    <<: *default-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yijian}
      POSTGRES_USER: ${POSTGRES_USER:-yijian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    # 默认值按「笔记本 Docker Desktop 也能起来」设定，避免 shared_buffers 申请不到内存直接崩。
    # 4C8G 及以上生产机请在 .env 中放大：
    #   PG_SHARED_BUFFERS=1GB  PG_EFFECTIVE_CACHE_SIZE=3GB  PG_MAX_CONNECTIONS=200
    command: >
      postgres
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c log_min_duration_statement=500
      -c timezone=Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal:/var/lib/postgresql/wal_archive
      # 数据卷为空时自动建表（只执行一次）
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    expose:
      - "5432"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yijian} -d ${POSTGRES_DB:-yijian}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ------------------------------------------------------------------
  # Redis 7
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: yijian-redis
    <<: *default-restart
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ------------------------------------------------------------------
  # 后端 API（Batch 2 交付主体）
  # ------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: yijian-api:${IMAGE_TAG:-latest}
    container_name: yijian-api
    <<: *default-restart
    env_file:
      - .env
    environment:
      # 容器内网地址覆盖 .env 里的 localhost 写法
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yijian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yijian}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SCHEMA_FILE: /db/schema.sql
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-120}
      REDIS_WAIT_TIMEOUT: ${REDIS_WAIT_TIMEOUT:-60}
    volumes:
      # 建表脚本与种子题库（只读）
      - ../db:/db:ro
      - ../data:/data:ro
      # 开发期挂载源码。生产部署请删掉这一行，改用镜像内代码
      - ../apps/api:/app
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  # ------------------------------------------------------------------
  # 以下属于 extras profile：Batch 2 用不到，按需启动
  #   docker compose --profile extras up -d
  # ------------------------------------------------------------------

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: yijian-meilisearch
    profiles: ["extras"]
    <<: *default-restart
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
    volumes:
      - meili_data:/meili_data
    expose:
      - "7700"
    ports:
      - "${MEILI_HOST_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: yijian-minio
    profiles: ["extras"]
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    container_name: yijian-minio-init
    profiles: ["extras"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-yijian-media} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_PRIVATE:-yijian-private} &&
      mc anonymous set download local/${MINIO_BUCKET:-yijian-media} &&
      echo 'MinIO buckets ready';
      "
    restart: "no"
    logging: *default-logging

  # 以下在 Batch 3 之后启用
  # web:
  #   build: { context: ../apps/web, dockerfile: Dockerfile }
  #   container_name: yijian-web
  #   <<: *default-restart
  #   env_file: .env
  #   depends_on: [api]
  #   ports: ["3000:3000"]
  #
  # celery-worker:
  #   build: { context: ../apps/api, dockerfile: Dockerfile }
  #   container_name: yijian-celery
  #   <<: *default-restart
  #   env_file: .env
  #   depends_on:
  #     redis: { condition: service_healthy }
  #   command: python -m app.cli wait-redis && celery -A app.tasks.celery_app worker -l info -c 4

volumes:
  pg_data:
  pg_wal:
  redis_data:
  meili_data:
  minio_data:

networks:
  default:
    name: yijian-net
