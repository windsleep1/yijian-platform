# CI 门禁 —— 门禁整顿（2026-09-20 起）
#
# ## ⚠️ 从 2026-09-24 起这一跳长期变红（BL-16，2026-09-26 定位中）
#
# `pytest` **从 68 秒变成 >12 分钟**（每次都撞 `timeout-minutes: 12` 被 kill），
# 紧随其后的「覆盖率门禁」**恒为 `skipped`** ⇒ **覆盖率门槛这些天一次都没生效**。
# 实测对照（`actions/runs/{id}/jobs`，匿名可读）：
#
#     e593486（09-23 23:32Z，最后一次绿）  pytest = 68s  覆盖率门禁 2s ✅
#     d033461 起 8 连红                    pytest = 12m12s（被 kill）
#
# ⚠️ **不是"某个提交改坏的"**：第一个变红的 `d033461` 只删了 README 3 行；
#    同一份代码在前一次 run 里是绿的 ⇒ **间歇性挂起**。
# ⚠️ **也不是"CI 机器慢"**：本地同口径跑 318 条要 **152.6s**，而 CI 绿的时候只要 **68s**
#    ——**CI 比本地快**，所以 68s → 12min 是异常，不是"慢"。
#
# 处置：`apps/api/pytest.ini`（`timeout = 90` / `timeout_method = thread`）把粒度从
# "整步"降到"单条用例 + 线程堆栈"；本文件的 pytest 步骤把关键行回显成 `::error::`
# annotation —— **因为 job 日志匿名读不到（403），而 annotation 匿名读得到**。
#
# ## 两个"看 CI 状态"的坑（踩过）
#
# 1. **每次 push 有两条 run**：`CI`（门禁）与 `pages build and deployment`（GitHub Pages 自动，
#    40~60 秒、通常 success）。**只看"最近一条 success"会误判成"CI 是绿的"**（坑 65）。
#    正解：按 workflow 过滤（`/actions/workflows/362493984/runs`）。
# 2. **日志正文匿名读不到（403）**，但下面两个通道可以：
#      · `GET /actions/runs/{id}/jobs` → **每一步**的 conclusion + 起止时间
#      · `GET /check-runs/{job_id}/annotations` → 步骤里 `::error::` 发出的内容
#
# ## 跑什么（全部**拦截式**）
#
#     ruff check                   **全仓**静态检查（apps/api + tools/ + db/）
#     ruff format --check          格式（**范围仍是 apps/api** —— 全仓有 29 文件存量，见 BL-10）
#     pytest                       后端全量用例（真 PostgreSQL）
#     coverage combine             三份进程数据合并（api / cli / tests）
#     coverage report              后端覆盖率（门槛 = `.coveragerc` 的 fail_under，**当前 94.40**）
#     sha256sum .coverage          合并结果指纹（两次 run 对比 → 验合并确定性）
#     npm run lint                 前端 eslint（规则全 error）
#     npm run format:check         前端格式（prettier，配置见 prettier.config.mjs）
#     tsc --noEmit                 前端类型
#     check-auth-chain.mjs         反向检查：认证链路**只有一份实现**（apps/<app>/src 里 0 命中）
#     node --test packages/api-core 共享包单测（Node 22 的 TS 擦除，14 用例）
#     npm run build                前端**可编译性**门禁（≠ 部署产物，见下方专节）
#
# ## 为什么 `next build` 现在进了 CI（2026-09-26，BL-12）
#
# 起因：C 端要复用 admin 的认证链路，做法是抽 `packages/api-core`（**纯 TS 源码**，
# 不产出 dist）。而"跨包 TS 能不能被 Next 正确编译/解析"**只有 build 会暴露** ——
# 本机沙箱跑不了 build（坑 60），而 CI 的 runner 恰好就是 `docs/21` **BL-05** 要的那个
# "**不受沙箱限制的环境**"。所以这一步同时闭合两件事：
#
#   ① BL-05（"部署前手工跑一次 build"）**降级成"每次 CI 都验"**；
#   ② 让"抽共享包"这个决定**有了可验证的前提**（在此之前它是不可验证的 ——
#      那意味着风险被推迟到部署时，正是 BL-05 记的那个盲区）。
#
# 取舍的另一面（为什么不是"抽包 + 本地自测"就够了）：**结构性保证 > 检测保证**。
# 不抽包、改成"两端标记比对"也能发现问题，但那只告诉你"不一致"；
# 抽包让"两份"**根本不存在**（`docs/22` §9.2.2 第 1 级）。
#
# ⚠️ **它是"可编译性门禁"，不是"部署产物"**：这里没有注入生产 API base，
#    产出的 `.next/` 只用来证明"能编译、SSR 层没炸"。真部署仍按 `docs/06`。
# ⚠️ 它**可能第一次就红** —— 那正是它存在的价值：BL-05 记的就是"只有 build/部署
#    才暴露"的那几类（server component 访问 `window`、`useSearchParams` 缺 Suspense
#    边界、动态导入、`generateMetadata`）。红了**修代码**，不要 `ignoreDuringBuilds`。
#
# ## ⚠️ 与 concurrency 的相互作用（2026-09-26，观察判据见 BL-15）
#
# 本 workflow 有 `concurrency: cancel-in-progress`。加上 build（1~3 分钟）之后，
# **连续快速 push 更可能把前一次 run 取消掉**。取消本身不是错（结果更贴近最新提交），
# 但它会让"frontend 步骤没跑完"看起来像失败。
# ⇒ 判据（可判定，不是"观察一两周"）：**连续 3 次 run 的 frontend job conclusion 为
#    `cancelled`** → 才考虑把 build 限制成只在 push 到 main 时跑。
#
# ## 覆盖率为什么要采**三份**数据（2026-09-22 对齐，硬约定 L）
#
# 业务代码在**哪个进程**里跑，覆盖率就得在**哪个进程**里插桩 —— 一份都省不掉：
#
#     .coverage.api     API 进程      serve_fake_redis.py --coverage --cov-data-file
#     .coverage.cli     CLI 进程      seed-rbac / seed-admin（两个进程共用一份，用 --append）
#     .coverage.tests   pytest 进程   单元测试里直接调用 app 代码的那部分
#     .coverage         combine 三份之后的**报告用**文件
#
# ⚠️ 之前只采 `.coverage.api` 一份，结果是**本地 89.25% / CI 86.7%** —— 两个环境报两个数，
#    正是硬约定 J 要防的东西（两个测量值 = 两个不同的测量）。
#    当时的注释写「在 pytest 进程里跑 `--cov=app` 只会量到测试自己导入的几个纯函数模块」——
#    这句本身没错，**错在据此把那一份整份丢掉**：正确做法是**单独采一份再合并**，不是不采。
#    `cli.py` 整文件曾报 0%（190/190），就是这条口径丢出来的假账。
#
# ## 拦截式 vs 上报式（演进的痕迹，留着有用）
#
# | 检查 | 第一步 | 现在 |
# |---|---|---|
# | `tsc --noEmit` | **拦截** | 不变 |
# | `pytest` | **拦截** | 不变 |
# | `ruff check` | 上报（`continue-on-error`） | **拦截**（存量 19 条清零后转的；2026-09-25 **范围扩到全仓**） |
# | `npm run lint` | 不在 CI（本地全 warn，退出码 0） | **拦截**（存量 14 条清零 + 提级后上来的） |
# | `coverage report` | 无 | **拦截**（门槛依据见 `.coveragerc`） |
# | `coverage combine` | 无（只采 API 进程一份） | **拦截**（2026-09-22：三份各进程插桩 + combine） |
# | `ruff format --check` | 无 | **拦截**（Commit B：先全仓格式化，再挂 check） |
# | `npm run format:check` | 无 | **拦截**（同上） |
# | `check-auth-chain.mjs` | 无 | **拦截**（2026-09-26：共享包落地时同时挂上反向检查） |
# | 共享包单测 `node --test` | 无 | **拦截**（同上） |
# | `npm run build` | **不在 CI**（本机沙箱跑不了，见坑 60） | **拦截**（2026-09-26，BL-12） |
#
# 两步都遵循同一条取舍：**存量没清完之前只上报，不清完就设拦截会让 CI 恒红，
# 而恒红的门禁等于没有门禁**（硬约定 H）——
# 人很快就不看了，跟"没配置"效果完全一样。
#
# ⚠️ 格式检查的挂载顺序也很重要：**必须先做完那次全仓格式化，再挂 check**。
# 反过来（先挂 check）CI 会从第一秒就红，而红着的门禁没有人会读 ——
# 结果就是有人把它加进 ignore 列表，永久失效。
#
# ## 每一步都在复刻 `run-smoke.ps1` 的链路
#
# 起 PG → 建表 → 迁移 → 种子(RBAC/超管) → **题库种子** → 起 API → pytest → 合并覆盖率 → 门禁。
# 「题库种子」这一步**调的是 `tools/local-verify/seed-questions.py`** ——
# 与 `run-smoke.ps1` 同一个脚本；`--coverage/--shutdown-file/--cov-data-file` 也是同一套参数。
# **修坑 51 时最容易犯的错是 CI 与本地各写一套**，那两套迟早漂，
# 于是又回到"本地绿、CI 红"的口径分歧。
#
# ⚠️ 覆盖率的**门槛数字不在本文件里**（不在命令行写 `--fail-under`）：
#    唯一来源是仓库根 `.coveragerc` 的 `[report] fail_under`，本地与 CI 共用同一份。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时取消上一次未跑完的 —— 省额度，结果也更贴近最新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================ 后端
  backend:
    name: 后端（ruff + pytest + coverage）
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yijian
          POSTGRES_DB: yijian
          # 本地/CI 用 trust 免密：与 tools/local-verify 里写死的 DSN
          # （`postgresql+asyncpg://yijian@127.0.0.1:<port>/yijian`，**不带密码**）保持一致。
          # 生产不走这条路（见 docs/06）。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yijian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql+asyncpg://yijian@127.0.0.1:5432/yijian
      APP_ENV: local
      # ⚠️ 必须与 `tools/local-verify/serve_fake_redis.py` 里写死的值一致：
      #    它自己 `os.environ.setdefault` 了 JWT_SECRET / REDIS_URL / SMS_PROVIDER，
      #    而 **seed-rbac / seed-admin / pytest 是另外三个进程**，
      #    它们拿不到那个 setdefault —— 必须在这里对齐，否则 token 签验不上。
      JWT_SECRET: local-verify-secret-not-for-production
      SMS_PROVIDER: mock
      ADMIN_INIT_PHONE: "13800000000"
      ADMIN_INIT_PASSWORD: Admin@123456
      AI_BASE: http://127.0.0.1:8123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # ---- 身份锚点：让日志**自带出处**（坑 56）----
      #
      # 为什么**独立成一步、且放最前面**：贴回来的日志可能来自 pytest / 覆盖率门禁 /
      # 或将来新增的步骤 —— **只在一处 echo 不够**。把身份打在每一段关键输出的开头，
      # "复制"这个动作就天然带上了"这是哪一次运行"。
      #
      # ⚠️ `GITHUB_HEAD_REF` **只在 PR 事件里有值**，push 时是空的（日志里会留下 `branch=`，
      #    看起来像 bug）—— 所以额外打了 `name=$GITHUB_REF_NAME`（push 时是 `main`，
      #    PR 时是分支名），两种事件都可用。
      - name: 打身份锚点
        run: echo "run=$GITHUB_RUN_ID sha=$GITHUB_SHA ref=$GITHUB_REF branch=$GITHUB_HEAD_REF name=$GITHUB_REF_NAME"

      - name: 安装依赖
        run: pip install -r apps/api/requirements.txt

      # ---- 清场：删掉上一轮的覆盖率数据（**必须在第一次采集之前**）----
      #
      # ⚠️ 位置有讲究，**不能挪回「起 API」那一步**（原来就在那里）：
      #    CLI 插桩（下面的「种子（RBAC + 超管）」）**排在起 API 之前**，
      #    那时 `.coverage.cli` 已经产出了 —— 清场若放在起 API 那一步，
      #    会把**刚采到的 CLI 数据删掉**。症状是 combine 报「.coverage.cli 缺失」，
      #    而根因是清场顺序错了：**错的症状指向错的地方**（硬约定 J 的同类风险）。
      #
      # 逐份列名，**不写 `.coverage*`** —— 那个通配符会匹配到 `.coveragerc`（配置文件）。
      - name: 清场（删除历史覆盖率数据）
        run: |
          set -euo pipefail
          rm -f .coverage .coverage.api .coverage.cli .coverage.tests
          echo "清场完成，剩余 .coverage* ："
          ls -la .coverage* 2>/dev/null || echo "  （无，符合预期）"

      # ---- CI 自身的诊断段自检（**拦截式**）----
      # 为什么 CI 要验证自己的诊断能力：2026-09-26 实测 —— 那个诊断段在真实 CI 上
      # **一条 annotation 都没发出来**。原因有二，都是它自己的：① 三条 grep 全按"挂起"
      # 的形状写，而那次是**普通失败**；② 唯一能兜底的 `tail` 打到了
      # **stdout —— 而 job 日志匿名 403，等于没写**。
      # ⇒ 「诊断读不到 = 没有诊断」，与坑 51（验收脚本假绿）/ 硬约定 H 同族。
      #
      # 这一步拿三种**真实形态**的日志夹具（普通失败 / 挂起堆栈 / 空日志）+ 1 个变异，
      # 去验证 `pytest` 那一步的诊断段；该段用一对 PYTEST-DIAG **标记**原地提取
      # （不存在"测试里的逻辑 vs 脚本里的逻辑"这第二份副本）。
      # ⚠️ 这里**刻意不把那对标记的原文写出来** —— 写出来会让提取器把**这条注释**也认成标记
      #    （2026-09-26 实测：提取到 235 行垃圾 → 脚本乱跑 → 进程被 SIGTERM、**一个字都不输出**，
      #     看起来跟"脚本坏了"一模一样）。同理，`test-pytest-diag.sh` 里也只用带尖括号的完整形态匹配。
      # 放在最前面：诊断坏了要**立刻**知道，而不是等下次真出事时才发现它不说话。
      - name: CI 诊断段自检（拦截式）
        run: bash tools/local-verify/test-pytest-diag.sh

      # ---- 三件事之一：ruff（**拦截式**）----
      # 2026-09-20 转拦截：存量 19 条已清零（10 条 --fix + 8 条 E741 手动改名 +
      # 1 条 F821 补 import），`ruff check apps/api` 现在是 "All checks passed!" 退出码 0。
      # 在此之前它是 `continue-on-error`（只上报）—— 因为存量在身时设拦截会让 CI 恒红，
      # 而**恒红的门禁等于没有门禁**（硬约定 H 的同一逻辑）。
      #
      # 2026-09-25 扩范围：`apps/api` → **`.`（全仓）**。
      # 起因：`tools/local-verify/` 与 `db/seed/` 一直**不在任何 ruff 范围里** ——
      # 那里躺着 4 条 F841 / 2 条 F401（工具脚本与种子生成器），从来没人看见。
      # 清零后按同一条判据（存量 ≤ 20 条 → 顺手清掉并纳入）扩到全仓。
      # 判断依据与"为什么不连 format 一起扩"见下一条注释。
      - name: ruff check（拦截式，全仓）
        run: ruff check .

      # ---- 格式检查（拦截式，Commit B 起）----
      # 行宽取 100 而不是 ruff 默认的 88 —— 依据是实测（Python p95=83 / p99=97），
      # 贴着现有代码选能把格式化 diff 压到最小。配置在仓库根 ruff.toml。
      #
      # ⚠️ **范围仍是 `apps/api`，刻意没有跟着扩到 `.`**（2026-09-25 实测权衡）：
      #     `ruff format --check .` 会报 **29 个文件待格式化**（89 个已合规）——
      #     超过"可顺手清掉"的量级，扩了就是**恒红**（硬约定 H）。
      #     而且要清干净必须动 29 个文件的**纯格式** diff，那正是 `ruff.toml` 里写的
      #     「风格统一第二步」——**必须独立一个 commit**，否则会把业务改动淹掉。
      #     ⇒ 已记为待办 **BL-10**（`docs/21-待办清单.md`）。
      #     **"能覆盖"与"能过"是两件事：范围扩了但恒红，等于没有门禁。**
      - name: ruff format --check（拦截式）
        run: ruff format --check apps/api

      # ---- 建表 + 迁移：与 run-smoke.ps1 的第 2/3/3.5 步等价 ----
      # ⚠️ schema.sql 只在**首次建库**时载入，之后的列/种子变更全靠 db/migrations/
      #    （改 schema.sql 对已有库不生效 —— 见 B端联调坑.md「表结构陷阱」#12）
      - name: 建表 + 应用迁移
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U yijian -d yijian -v ON_ERROR_STOP=1 -q -f db/schema.sql
          shopt -s nullglob
          for m in db/migrations/*.sql; do
            echo "应用迁移 $m"
            psql -h 127.0.0.1 -U yijian -d yijian -v ON_ERROR_STOP=1 -q -f "$m"
          done

      # ---- 种子（RBAC + 超管）：**CLI 进程插桩**（2026-09-22 起）----
      #
      # `seed-rbac` / `seed-admin` 是**两个独立进程**，业务代码跑在它们里面，
      # 而覆盖率采集在 API 进程 —— 不插桩就永远看不见（`cli.py` 曾整文件报 0%）。
      # 判据（硬约定 L）：**代码在哪个进程跑，就在哪个进程插桩**，不要 omit。
      #
      # ⚠️ 数据文件与 rcfile 都用**绝对路径 `$GITHUB_WORKSPACE/...`**：
      #    本步的 `working-directory` 是 `apps/api`，写相对路径会把数据落在子目录里，
      #    之后在仓库根 combine 会找不到（症状同样是"缺文件"，根因却是路径）。
      # ⚠️ 两次进程**共用**一份 → 第二次必须 `--append`。
      #    实测过：`--append` 在文件不存在时**不报错**（exit 0，文件被创建），
      #    所以两条命令写法统一，不需要先 touch。
      - name: 种子（RBAC + 超管）
        working-directory: apps/api
        run: |
          set -euo pipefail
          coverage run --append --data-file "$GITHUB_WORKSPACE/.coverage.cli" \
            --source app --rcfile "$GITHUB_WORKSPACE/.coveragerc" -m app.cli seed-rbac
          coverage run --append --data-file "$GITHUB_WORKSPACE/.coverage.cli" \
            --source app --rcfile "$GITHUB_WORKSPACE/.coveragerc" -m app.cli seed-admin

      # ---- 题库种子：生成 + 灌库 ----
      #
      # ## 为什么必须有这一步（2026-09-20 实测发现，坑 51）
      #
      # `db/schema.sql` 只灌 subjects / chapters / RBAC，**不含 questions 与
      # knowledge_points**。题库来自 `db/seed/gen_seed_questions.py` 生成的
      # `data/seed/questions.sql`，而 `data/` 是 **gitignored** 的（可复现，不入库）。
      #
      # 于是在一个**真正全新的库**上，不灌题库会 **32 条用例失败**（v7 的组卷/加题/
      # 知识点下拉全都要有题可抽）。实测：
      #
      #     不灌题库 → 32 failed, 91 passed, 4 skipped
      #     灌了题库 → 126 passed, 1 skipped
      #
      # ## ⚠️ 逻辑**只有一份**（这一点比上面那条更重要）
      #
      # 本步**不写内联命令**，而是调 `tools/local-verify/seed-questions.py` ——
      # `run-smoke.ps1` 调的是同一个脚本。
      # 修坑 51 时最容易犯的错就是"CI 与本地各写一套"，那两套迟早漂，
      # 于是又回到"本地绿、CI 红"的口径分歧（正是坑 51 的形态）。
      #
      # 注：本步**不插桩**——它跑的是 `tools/` 下的脚本，不是 `app/` 的业务代码，
      #     不产生 `.coverage.*` 的第四份数据。
      - name: 题库种子（生成 + 灌库）
        run: python tools/local-verify/seed-questions.py --pg-port 5432

      # ---- 起 API：真 PostgreSQL + fakeredis 顶替 Redis + **覆盖率采集** ----
      # 为什么用 nohup + 重定向：长生命周期子进程若继承本 step 的 stdout，
      # Actions 会等这个管道 EOF 才认为 step 结束 —— 表现为**卡住直到超时**。
      #
      # 为什么覆盖率在**这个进程**里采：用例是 HTTP 打到它的，业务代码全跑在那边；
      # 在 pytest 进程里跑 `--cov=app` 只会量到测试自己导入的几个纯函数模块
      # （**所以那一部分要单独采一份 `.coverage.tests` 再合并，而不是不采** —— 见 pytest 那一步）。
      #
      # ⚠️ `--shutdown-file`：收尾不能靠 kill（进程直接消失、atexit 不跑 →
      #    覆盖率数据一个字都写不出来）。改成"放哨兵文件 → 进程自己收尾写盘"。
      #
      # ⚠️ 数据文件名是 `.coverage.api`（不再是 `.coverage`）—— 三份数据各归各的名字，
      #    合并后的文件才叫 `.coverage`。本步**不再负责清场**（已挪到最前面的独立步骤，
      #    因为那个位置会把刚采到的 `.coverage.cli` 删掉）。
      - name: 起 API 并等待就绪（带覆盖率采集）
        working-directory: tools/local-verify
        run: |
          set -euo pipefail
          rm -f /tmp/yijian-cov-stop
          nohup python serve_fake_redis.py --pg-port 5432 --api-port 8123 \
            --log-file /tmp/yijian-api.log \
            --coverage --cov-data-file "$GITHUB_WORKSPACE/.coverage.api" \
            --shutdown-file /tmp/yijian-cov-stop > /tmp/yijian-api.out 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8123/api/v1/health > /dev/null; then
              echo "API 已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API 未在 40s 内就绪"
          echo "---- serve 输出 ----"; cat /tmp/yijian-api.out || true
          echo "---- API 日志尾部 ----"; tail -40 /tmp/yijian-api.log || true
          exit 1

      # ---- 三件事之二：pytest（拦截式）+ **pytest 进程插桩**（2026-09-22 起）----
      #
      # 用例绝大多数走 HTTP 打到 API 进程，但**有一小部分是直接调用 app 代码**的
      # （如 `tests/test_idgen.py`、`test_admin_v4.py::test_content_hash_and_answer_derivation`）——
      # 它们跑在 pytest 进程里，API 进程采不到（硬约定 L：跨进程执行 = 跨进程测量）。
      #
      # ⚠️ `coverage run` 会把 pytest 的退出码**原样带出来**，所以用例失败仍然是硬失败，
      #    不会因为套了一层 coverage 就变成"看起来过了"。
      #
      # ---- `timeout-minutes`（2026-09-23 加，坑 57）----
      # 起因：run 35838184843 的这一步**跑了 1689s 还没结束**（前面 13 步一共 52s），
      # 人只能手动取消 —— 而取消掉的那一步**没有汇总行、也不报是哪条用例**，
      # 排障等于从"沉默"里猜。绿的时候这一步约 3~4 分钟，12 分钟留了 3 倍余量。
      #
      # 它**不修根因**，只把"无限期挂住"变成"有界的、自己会说话的失败"
      # （Actions 会标 `exceeded the maximum execution time`）——
      # 与硬约定 H「恒红的门禁等于没有门禁」同一条思路：**不说话的失败等于没有失败**。
      # ---- BL-16（2026-09-26）：从"整步沉默 12 分钟"改成"单条用例 + 堆栈" ----
      #
      # 背景：这一跳**从 68 秒变成了 >12 分钟**（e593486 绿时 pytest=68s；
      # d033461 起 8 连红，每次都是 12m12s 撞 `timeout-minutes: 12` 被 kill，
      # 紧随的「覆盖率门禁」**恒为 skipped** —— 也就是**门槛这些天一次都没生效**）。
      # 而**本地复现不出来**（同口径 318 passed / 152.6s，最慢单条 1.51s）⇒ 间歇性挂起。
      #
      # ⚠️ `timeout-minutes` 只能证明"**整步**超时"，它**不说挂在哪条** —— 不说话的失败
      #    等于没有失败（坑 57 的同一条推论）。粒度降到单条用例的配置在
      #    **`apps/api/pytest.ini`**（`timeout = 90` / `timeout_method = thread`），
      #    本地与 CI **共用那一个来源**（同 `.coveragerc` 的做法）。
      #
      # ⚠️ 下面这段 shell 不是装饰：**job 日志匿名读不到（403）**，而
      #    **check-run annotation 匿名可读**。所以把关键行回显成 `::error::`，
      #    让"挂在哪条、卡在哪一行"从一条**可读的通道**出来。
      #    （查询：`GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations`）
      #
      # ⚠️ `set -e` 故意不加：加了会在管道那一步直接退出，下面的诊断就永远不执行。
      #    退出码一律以 `PIPESTATUS[0]`（pytest 自己的）为准，**不许被 `tee` 吞掉**。
      - name: pytest
        timeout-minutes: 12
        working-directory: apps/api
        env:
          # ⚠️ 必须无缓冲。`timeout_method = thread` 触发时 pytest-timeout 走的是 **`os._exit(1)`**
          #    （本机实测：后续用例不再执行、连汇总行都没有）⇒ 缓冲区里没 flush 的输出会**整体丢失**，
          #    于是诊断看到的不是"错误内容"而是"日志是空的"。
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          LOG=/tmp/pytest.log
          # ⚠️ `-rfEXs` 而**不是** `-rs`。`-r` 是**替换**默认值：`-rs` 会把默认的 `-rfE` 顶掉，
          #    ⇒ 短汇总里只剩 skip、**`FAILED` 行整段不出现**（本机实测：`-q -rs` 下
          #    "short test summary info" 根本不打印）。而那一行正是"哪条用例挂了"的第一手信息。
          coverage run --data-file "$GITHUB_WORKSPACE/.coverage.tests" \
            --source app --rcfile "$GITHUB_WORKSPACE/.coveragerc" -m pytest tests -q -rfEXs 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # <<< PYTEST-DIAG:START >>>
            # ⚠️ 标记供 tools/local-verify/test-pytest-diag.sh **原地提取**本段做单元验证。
            #    这个 harness 存在的理由：**诊断读不到 = 没有诊断**（与坑 51 / 硬约定 H 同族）。
            #    第一版就在这里翻车：三条 grep 全按"挂起"写，而这次 CI 是**普通失败**，
            #    于是 annotation **一条都没发出**；唯一能兜底的 `tail` 又打到了**读不到的 stdout**。
            #
            #    三条纪律（都是踩出来的）：
            #      ① **stdout 读不到**（job 日志匿名 403）⇒ 关键信息必须发 `::error::` / 写 step summary；
            #      ② `-rs` 会把默认的 `-rfE` 顶掉 ⇒ 命令行用 `-rfEXs`（见上面那段注释）；
            #      ③ `timeout_method=thread` 走的是 **os._exit** ⇒ 必须 `PYTHONUNBUFFERED=1`。
            sumfile="${GITHUB_STEP_SUMMARY:-/dev/null}"
            logbytes=$(wc -c < "$LOG" | tr -d ' ')
            loglines=$(wc -l < "$LOG" | tr -d ' ')
            if grep -q 'Stack of MainThread' "$LOG"; then
              vcode=hang
              verdict='挂起（pytest-timeout 打断，整轮已终止）'
            else
              vcode=plain
              verdict='失败（pytest 正常跑完，未触发单条超时）'
            fi
            # 头部**一定**要发：它自己就能分辨"日志是空的"和"grep 没匹配上"（看 log_bytes）。
            printf '::error title=pytest诊断头::exit=%s log_bytes=%s log_lines=%s verdict=%s 判定=%s\n' \
              "$rc" "$logbytes" "$loglines" "$vcode" "$verdict"

            # 贴出去之前先脱敏（仓库公开、annotation 也公开）。
            redact() { sed -E 's/eyJ[A-Za-z0-9_-]{8}[A-Za-z0-9._-]*/eyJ_REDACTED/g'; }

            # 1) 失败用例（**只有 `-rfEXs` 才保证有这一行**）
            grep -E '^(FAILED|ERROR) ' "$LOG" | redact | head -20 | while IFS= read -r l; do
              printf '::error title=失败用例::%s\n' "$l"
            done
            # 2) 挂起位置（pytest-timeout 的线程堆栈；实测格式 `File "…/tests/x.py", line N, in test_y`）
            grep -oE 'tests[/\\][A-Za-z0-9_.-]+\.py", line [0-9]+, in [A-Za-z0-9_]+' "$LOG" \
              | tail -5 | while IFS= read -r l; do
              printf '::error title=挂起位置::%s\n' "$l"
            done
            # 3) FAILURES 段落标题（1) 兜不住的场景，例如 collection error）
            grep -nE '^_{5,} .+ _{5,}$' "$LOG" | redact | head -10 | while IFS= read -r l; do
              printf '::error title=失败段落::%s\n' "$l"
            done
            # 4) ★ 原始尾部兜底 —— **必须走 annotation**（stdout 读不到，写在那里等于没写）
            grep -vE '^[[:space:]]*$' "$LOG" | tail -25 | redact | while IFS= read -r l; do
              printf '::error title=日志尾部::%s\n' "$l"
            done
            # 5) 第二通道：step summary（长文本比逐行 annotation 更合适；两条通道互为备份）
            {
              echo "### pytest 诊断（exit=$rc / bytes=$logbytes / lines=$loglines / verdict=$vcode）"
              echo ""
              echo "$verdict"
              echo ""
              echo '```text'
              tail -40 "$LOG" | redact
              echo '```'
            } >> "$sumfile"
            # <<< PYTEST-DIAG:END >>>
          fi
          exit "$rc"

      # ---- 覆盖率门禁（拦截式）：优雅收尾 → 校验三份 → 合并 → 指纹 → 报告 ----
      #
      # 门槛（`fail_under = 85`）写在仓库根 `.coveragerc`，与本地 `run-smoke.ps1`
      # **同一个来源**；本文件**不在命令行再写一遍数字**。
      #
      # ⚠️ 顺序反了就拿到一个 0% 的假数字而不是报错 —— 那是最难发现的一种假绿。
      # ⚠️ 三份数据**缺一份就硬失败**，不静默合并：静默合并的表现是
      #    "某个进程没产出、而报告看起来正常（数字偏低但没有任何报错）"，
      #    与坑 44/51/54 同族 —— **没有任何东西会报错**的那一类。
      # ⚠️ 本步不设 `working-directory`：默认就是 `$GITHUB_WORKSPACE`，
      #    三份数据在那里、合并也在那里、报告也从那里出（三者必须同目录）。
      - name: 覆盖率门禁（合并三份 → 报告 → 指纹）
        run: |
          set -euo pipefail

          # ⚠️ 身份锚点（坑 56）：这一段输出最常被复制回来 —— 让它**自带出处**。
          echo "==== run=$GITHUB_RUN_ID sha=$GITHUB_SHA ref=$GITHUB_REF name=$GITHUB_REF_NAME ===="

          # ---- 1. 让 API 优雅退出（放哨兵 → 它自己 cov.save()）----
          touch /tmp/yijian-cov-stop
          for i in $(seq 1 60); do
            if ! curl -sf http://127.0.0.1:8123/api/v1/health > /dev/null; then
              echo "API 已优雅退出，覆盖率数据已落盘"
              break
            fi
            sleep 1
          done

          # ---- 2. 失败态显式：三份逐份检查「存在且非空」，缺一份就退出 ----
          for f in .coverage.api .coverage.cli .coverage.tests; do
            if [ ! -s "$f" ]; then
              echo "::error::覆盖率数据缺失或为空：$f —— 拒绝静默合并"
              echo "---- 现有 .coverage* ----"; ls -la .coverage* || true
              echo "---- API 日志尾部 ----"; tail -20 /tmp/yijian-api.log || true
              exit 1
            fi
            echo "  ✅ $f  $(stat -c%s "$f") bytes"
          done

          # ---- 3. 合并三份（在仓库根跑；combine 会**删除输入文件**）----
          echo "---- combine ----"
          coverage combine --data-file .coverage .coverage.api .coverage.cli .coverage.tests
          if [ ! -s .coverage ]; then
            echo "::error::combine 未产出 .coverage（或为空）"
            exit 1
          fi

          # ---- 4. 指纹：两次 run 的 sha256 应当一致 → 这就是合并确定性的 dry run ----
          echo "---- .coverage 指纹（与另一次 run 对比）----"
          sha256sum .coverage

          # ---- 5. 门禁本体 ----
          coverage report --data-file .coverage --skip-covered
          # `fail_under` 在 `.coveragerc` 的 [report] 里（现为 85）：
          # `coverage report` 自动读它，低于门槛就以非 0 退出。

  # ================================================================ 前端
  frontend:
    name: 前端（lint + tsc + build）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      # ---- 反向检查：认证链路**只有一份实现**（最先跑，最便宜）----
      #
      # 它防的是 `docs/22` §9.2 那个决定的**腐化方式**：不是"共享包被改错"，
      # 而是"有人又在某个 app 里把单飞刷新重写了一遍"。那种漂移**不会报错、不会变红**，
      # 只会让两端慢慢分叉 —— 这正是"把三处逐字一致交给'我小心'"会输的地方。
      # 不需要 npm 依赖（纯 node + fs），所以放在 `npm ci` 之前。
      - name: 反向检查 · 认证链路单一真相（拦截式）
        run: node tools/local-verify/check-auth-chain.mjs

      - name: 安装依赖
        working-directory: apps/admin
        run: npm ci

      # ---- 共享包单测（拦截式）----
      # 跑的是**源码**（`.ts`），靠 Node 22 的类型擦除 —— 所以这个包不产出 dist，
      # 也就没有"dist 与 src 漂移"这第二个真相（`docs/22` §9.2.3）。
      # ⚠️ 入口是 `run-tests.mjs` 而不是裸 `node --test`：后者在**全部 skip** 时退出码也是 0
      #    （与 pytest 同一个坑）。守卫判 `pass >= 1 且 skipped == 0 且 fail == 0`，
      #    并在**读不到 TAP 汇总行**时也失败（宁报"没跑成"，不把"读不到"当通过）。
      - name: 共享包单测 · packages/api-core（拦截式）
        working-directory: packages/api-core
        run: npm test

      # ---- eslint（拦截式，2026-09-20 起）----
      # 这是它**第一次**成为真门禁：以前 `npm run lint` 连配置都没有，
      # 跑起来会进「How would you like to configure ESLint?」交互式提问 ——
      # 在 CI 里等于直接卡死（坑 44）。补配置后先全设 warn 跑出清单，
      # 14 条存量清完再提级为 error，此刻才挂上来。
      #
      # ⚠️ eslint 用的是 devDependencies，所以必须放在 `npm ci` 之后。
      - name: npm run lint（拦截式）
        working-directory: apps/admin
        run: npm run lint

      # ---- 格式检查（拦截式，Commit B 起）----
      # prettier 的配置在 apps/admin/prettier.config.mjs（printWidth 100，理由写在注释里）。
      # ⚠️ `.prettierignore` 里**刻意排除了 Markdown 与 docs/** —— 那些是手写文档，
      # 换行是刻意的（手工对齐的表格、按语义断的列表），格式化它们不带来工程收益，
      # 只会产出几百行无信息量的 diff。
      - name: npm run format:check（拦截式）
        working-directory: apps/admin
        run: npm run format:check

      # ---- 共享包 / 检查脚本的格式（它们在 `apps/admin` **之外**）----
      # `prettier --check .` 的 `.` 是 apps/admin，所以 `packages/api-core` 与
      # `tools/local-verify/*.mjs` **本来没有任何格式门禁** —— 那是"没覆盖"，
      # 而"没覆盖"与"能过"是两件事（硬约定 H）。补这一条把它们纳入。
      - name: npm run format:check:shared（拦截式）
        working-directory: apps/admin
        run: npm run format:check:shared

      # ---- 三件事之三：tsc（拦截式）----
      # ⚠️ 这一步**顺带**覆盖了共享包的类型：`api.ts` import 了它，tsc 会跟着编译；
      #    所以共享包不需要单独一道 typecheck（少一道就少一处会漂的口径）。
      - name: tsc --noEmit
        working-directory: apps/admin
        run: npm run typecheck

      # ---- ★ build（拦截式，2026-09-26 新增，BL-12）----
      # 这是**"只有 build 会暴露"的那一类问题的唯一闸门**（SSR / server component /
      # 动态导入 / `useSearchParams` 缺 Suspense 边界 / 跨包 TS 能否被解析）。
      # 本机沙箱跑不了 build（坑 60）—— CI 就是那个"不受沙箱限制的环境"。
      # 为什么必须由它来验：抽了 `packages/api-core` 之后，"跨包能不能打出来"
      # **在本地不可证**，不设这道闸就等于把风险推到部署。
      #
      # `timeout-minutes` 是**有界等待**（硬约定 N）：没有它，一个卡住的 build
      # 只会表现为"这一步一直转"，而失败的形状应该是"自己会说话"。
      #
      # ⚠️ **env 口径必须显式**：本机 `apps/admin/.env.local` 是 **gitignored** 的
      #    （`NEXT_PUBLIC_API_BASE` 指向本地后端），**CI 里不存在** ——
      #    所以"本地 build"与"CI build"默认**不是同一个配置**（哪怕都成功）。
      #    这里显式给一个**占位值**，让 CI 的构建配置是可见的、可复现的；
      #    它**只是门禁用的值，不是部署值**（部署仍按 `docs/06`）。
      - name: npm run build（拦截式，可编译性门禁）
        timeout-minutes: 10
        working-directory: apps/admin
        env:
          NEXT_PUBLIC_API_BASE: https://ci-build-gate.invalid/api/v1
        run: npm run build
