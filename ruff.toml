# Ruff 配置 —— 门禁整顿**第一步**（2026-09-20，用户定）
#
# ## 本步的规则集：**故意只开默认集**
#
# 用户把门禁整顿分两步走：本步「只做真门禁，**不引入新风格**」，
# 下一步（独立批）才做风格统一。所以这里刻意只保留 ruff 的默认规则集：
#
#     E4  pycodestyle 的导入相关（重复导入等）
#     E7  语句级问题（`== None`、未使用的变量…）
#     E9  运行前就能看出的语法/逻辑错误
#     F   Pyflakes（未使用的导入/变量、未定义名字、重复定义）
#
# 这一组**不含任何风格规则** —— 没有行宽（E501）、没有 import 排序（I）、
# 没有引号/尾随逗号偏好。它们全部留到「第二步：风格统一」，与 `ruff format`
# 一起、**单独一个 commit** 落地（全仓格式化的 diff 会把业务改动淹掉，必须分开）。
#
# `select` 写出来而不是靠"没人配置所以碰巧是默认值"，是为了让它**显式可见**：
# ruff 将来若调整默认集，我们这里不会跟着静默漂移。

target-version = "py312"

# 虚拟环境 / 构建产物 / 缓存不进（它们本来也在 .gitignore 里，
# 但显式列出来才不会因为"某天仓库里多了个 .venv"而突然刷屏）。
# ⚠️ `extend-exclude` 是**顶层**键（文件发现阶段用），不在 `[lint]` 下 ——
# 放错位置会让 ruff 直接报 `unknown field` 并退出码 2（实测踩到）。
extend-exclude = [".venv", "venv", "__pycache__", ".ruff_cache"]

[lint]
select = ["E4", "E7", "E9", "F"]
