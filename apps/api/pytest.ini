# pytest 配置 —— BL-16（2026-09-26）
#
# ## 为什么需要这个文件
#
# CI 的 `pytest` 步骤**从 68 秒变成了 >12 分钟**：
#
#     e593486（09-23 23:32Z，最后一次绿）  pytest = 68s   覆盖率门禁 2s ✅
#     d033461 起 8 连红                     pytest = 12m12s（撞 timeout-minutes: 12 被 kill）
#                                           ⇒ 紧随的「覆盖率门禁」**恒为 skipped**
#
# 而**本地复现不出来**（与 CI 同口径跑 `coverage run … pytest tests`：
# 318 passed / 152.6s，**最慢的单条 1.51s**）。⇒ 是**间歇性挂起**，且挂在哪条**未知**。
#
# ⚠️ 关键：`timeout-minutes: 12` 只能证明"**整步**超时"，它**不告诉你哪条用例挂了** ——
#    而不说话的失败等于没有失败（坑 57 的同一条推论）。本文件把粒度从"整步"降到"单条"。
#
# ## 取值依据（不是拍的）
#
#   timeout = 90         本地最慢单条 1.51s、CI 整步 68s（约 300 条）
#                        ⇒ 单条 90s 已是 **60 倍余量**：
#                          **只会抓到真挂起，不会误杀慢用例**（判据要收窄有据、放宽也有据）
#
#   timeout_method = thread
#                        到点后用 faulthandler **dump 所有线程的堆栈**再中止。
#                        ⚠️ 为什么不用默认的 `signal`：`signal` 只是把该用例判失败，
#                        **看不到它卡在哪个调用上**；这里要的正是"卡在哪一行"，
#                        因为根因还没定位（同一个形状上次的答案是"等一把没提交的行锁"）。
#
# ## ⚠️ 这不是根因修复
#
# 它是**定位工具 + 防呆**：把"沉默 12 分钟"换成"90 秒后指名道姓 + 给出堆栈"。
# **不要**因此把它当成"问题解决了"——BL-16 的根因仍是 **OPEN**，
# 定位到之后再回来改这一条（例如把 timeout 收紧，或删掉它）。
#
# ⚠️ 放在 `apps/api/` 而不是仓库根：pytest 的 rootdir 就是这里（CI 与本地的
# `working-directory` 都是 `apps/api`），**一个来源、两处生效** ——
# 与 `.coveragerc` 同一条原则（门槛数字不在命令行里重复写第二遍）。

[pytest]
timeout = 90
timeout_method = thread
